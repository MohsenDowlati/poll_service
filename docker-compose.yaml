version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: poll_service:latest
    container_name: poll_service
    restart: unless-stopped
    env_file: .env
    ports:
      # Provide a default if PORT is not set in .env
      - "${PORT:-8080}:${PORT:-8080}"
    depends_on:
      - mongodb

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: unless-stopped
    env_file: .env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=$DB_USER
      - MONGO_INITDB_ROOT_PASSWORD=$DB_PASS
    ports:
      # default mongo port with fallback
      - "${DB_PORT:-27017}:${DB_PORT:-27017}"
    volumes:
      - dbdata:/data/db

volumes:
  dbdata:
